trainer:
  max_epochs: 50
  devices: 2
  precision: bf16-mixed
  strategy:
    class_path: lightning.pytorch.strategies.DDPStrategy
    init_args:
      find_unused_parameters: true
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: "logs"
      name: "sea_panoptic_joint_scratch_896_cp_eomt_large"
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: "metrics/val_pq_all"
        mode: max
        save_top_k: 1
        save_last: true
        filename: "best-{epoch:03d}-{step:06d}"
model:
  class_path: training.mask_classification_panoptic.MaskClassificationPanoptic
  init_args:
    load_ckpt_class_head: False
    load_ckpt_reid_head: False
    lr: 7.07e-5
    eval_max_size: 1024
    attn_mask_annealing_enabled: True
    attn_mask_annealing_start_steps: [26275, 52550, 78825, 105100]
    attn_mask_annealing_end_steps:   [52550, 78825, 105100, 131375]
    assoc_coefficient: 2.0
    assoc_temperature: 0.07
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_q: 200
        reid_enabled: True
        reid_dim: 256
        grad_checkpointing: True
        encoder:
          class_path: models.vit.ViT
data:
  class_path: datasets.sea_panoptic.SeaPanoptic
  init_args:
    num_classes: 4
    stuff_classes: [2, 3]
    batch_size: 1
    num_workers: 8
    img_size: [896, 896]
    scale_range: [0.5, 2.0]
    path: /path/to/data_panoptic_track
    sequence_mode: True
    use_gt_track_ids: True
    ref_frame_max_gap: 5
    ref_max_sample_gap: 3
    copy_paste_enabled: True
    copy_paste_prob: 0.5
    copy_paste_max_instances: 3
