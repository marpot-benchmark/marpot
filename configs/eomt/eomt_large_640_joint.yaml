data:
  class_path: datasets.sea_panoptic.SeaPanoptic
  init_args:
    batch_size: 8
    num_classes: 4
    num_workers: 16
    path: /path/to/data_panoptic_track
    ref_frame_max_gap: 5
    ref_max_sample_gap: 3
    sequence_mode: true
    stuff_classes:
    - 2
    - 3
    use_gt_track_ids: true
model:
  class_path: training.mask_classification_panoptic.MaskClassificationPanoptic
  init_args:
    assoc_coefficient: 2.0
    assoc_temperature: 0.07
    attn_mask_annealing_enabled: false
    attn_mask_annealing_end_steps: null
    attn_mask_annealing_start_steps: null
    eval_max_size: 1024
    load_ckpt_class_head: true
    load_ckpt_reid_head: false
    lr: 0.00014
    network:
      class_path: models.eomt.EoMT
      init_args:
        encoder:
          class_path: models.vit.ViT
        num_q: 200
        reid_dim: 256
        reid_enabled: true
trainer:
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      filename: best-{epoch:03d}-{step:06d}
      mode: max
      monitor: metrics/val_pq_all
      save_last: true
      save_top_k: 1
  devices: 1
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      name: sea_panoptic_joint_eomt_large_640
      save_dir: logs
  max_epochs: 15
  precision: bf16-mixed
