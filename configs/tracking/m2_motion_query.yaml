tracker:
  type: motion_iou
  iou_kind: mask
  mask_iou_threshold: 0.3
  center_dist_factor: 2.0
  delta_t_cap: 10
  scene_cut_gap: 50
  max_age_samples: 20
  max_age_frames: 60
  min_hits: 3
  min_score_ship: 0.4
  min_score_obstacle: 0.3
  use_query_embed: true
  cost_weights: { iou: 0.5, query: 0.3, center: 0.2, area: 0.0, appearance: 0.0 }
